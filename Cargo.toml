[package]
name = "min-specialization"
version = "0.2.1"
description = "Experimental implementation of specialization"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
keywords = ["macros", "zerocost", "specialization", "proc-macro", "trait"]
categories = [
  "rust-patterns",
  "development-tools",
  "development-tools::procedural-macro-helpers",
  "no-std",
  "no-std::no-alloc",
]
repository = "https://github.com/yasuo-ozu/min_specialization"
homepage = "https://github.com/yasuo-ozu/min_specialization"
documentation = "https://docs.rs/min-specialization"
readme = "README.md"
edition = "2021"
rust-version = "1.56.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
template-quote = "0.4"
proc-macro-error = "1.0"
derive-syn-parse = "0.1.5"

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit-mut", "visit"]

[dev-dependencies]
trybuild = "1.0"
